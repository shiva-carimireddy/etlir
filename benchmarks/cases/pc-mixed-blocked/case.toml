# Benchmark case manifest. See benchmarks/protocol.md for the meaning of each field.
id = "pc-mixed-blocked"
title = "Fail-closed behavior: one clean branch, one branch with a lookup, SQL override, stateful variable, command task and custom link condition"
provenance = "original-synthetic"
license = "Apache-2.0"
source = "powercenter-xml"
inputs = ["source/wf_mixed.xml"]
partition = "behaviorally-comparable"

[run]
# Blocked tasks never run; this runs the unaffected branch only.
allow_partial = true

[expect]
blocked_tasks = ["cmd_ARCHIVE", "s_m_CUSTOMER_OVERRIDE", "s_m_CUSTOMER_REGION"]
diagnostic_codes = ["IR-V-010", "IR-V-012"]

[bindings]
"bind:ETLIR_SYNTH:ETLIR_DEMO:src:FlatFile:CUSTOMERS" = { format = "csv", path = "inputs/customers.csv" }

[outputs]
"bind:ETLIR_SYNTH:ETLIR_DEMO:tgt:CUSTOMER_COPY" = "expected/customer_copy.jsonl"
