[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "etlir"
dynamic = ["version"]
description = "Source- and target-decoupled ETL modernization framework built on a typed, traceable Canonical Intermediate Representation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Shiva Kumar Reddy Carimireddy", email = "shivacarimireddy@ieee.org" }]
keywords = [
  "etl",
  "intermediate-representation",
  "data-engineering",
  "modernization",
  "migration",
  "provenance",
  "spark",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Compilers",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "packaging>=23",
  "defusedxml>=0.7",
  "sqlglot>=30,<31",
]

[project.optional-dependencies]
spark = ["pyspark>=4.0,<5"]
duckdb = ["duckdb>=1.1,<2"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-defusedxml",
  "duckdb>=1.1,<2",
]

[project.scripts]
etlir = "etlir.cli:main"

# Plugin discovery. In-tree and third-party packages register the same way; see
# docs/extending.md.
[project.entry-points."etlir.sources"]
powercenter-xml = "etlir.sources.powercenter:PowerCenterAdapter"

[project.entry-points."etlir.targets"]
spark = "etlir.targets.spark:SparkEmitter"
duckdb = "etlir.targets.duckdb:DuckDBEmitter"

[project.urls]
Homepage = "https://github.com/shiva-carimireddy/etlir"
Repository = "https://github.com/shiva-carimireddy/etlir"
Issues = "https://github.com/shiva-carimireddy/etlir/issues"
Changelog = "https://github.com/shiva-carimireddy/etlir/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/etlir/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/etlir"]

[tool.hatch.build.targets.sdist]
include = ["src/", "schemas/", "tests/", "docs/", "benchmarks/cases/", "benchmarks/corpus.toml", "benchmarks/protocol.md", "scripts/", "LICENSE", "NOTICE", "README.md", "CITATION.cff", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "spark: requires a local PySpark/Java runtime (skipped when unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]  # assert is idiomatic in pytest

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# SQL code generator: identifiers are quoted with q(), literals escaped with lit(); source
# text is never interpolated (expressions are lowered from the typed Canonical IR AST).
"src/etlir/targets/duckdb/*.py" = ["S608"]
# SQL text here is only parsed (with SQLGlot) into canonical operations, never executed.
"src/etlir/sources/powercenter/sql.py" = ["S608"]
"src/etlir/sources/powercenter/normalize.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["etlir"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
# Runtime helpers are copied into generated packages and run against PySpark/DuckDB.
exclude = ["etlir_spark_runtime\\.py$", "etlir_duckdb_runtime\\.py$"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "duckdb.*"]
ignore_missing_imports = true
